<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study Room Group Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>
<body>
<div class="container">
    <header class="header">
        <h1>Study Room Group Chat</h1>
        <p>Enter your name to chat and access drive links!</p>
    </header>
    <main>
        <div class="chatbox" id="chatbox"></div>
        <form id="form" onsubmit="return false;" autocomplete="off">
            <input type="text" id="username" placeholder="Name" required />
            <input type="text" id="input" placeholder="Type a message..." disabled />
            <button id="sendBtn" disabled>Send</button>
        </form>
        <div class="help-tip">
            Type <code>list</code> to see subjects, or any subject code like <code>DS</code> to get notes.
        </div>
    </main>
    <footer>
        <p>Made with Flask &#x1F4DA;</p>
    </footer>
</div>
<script>
let socket = io();
let username = "";
const chatbox = document.getElementById('chatbox');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const userField = document.getElementById('username');
const form = document.getElementById('form');

userField.addEventListener('change', () => {
    if (userField.value.trim()) {
        username = userField.value.trim();
        input.disabled = false;
        sendBtn.disabled = false;
        userField.disabled = true;
        socket.emit('join', {username});
    }
});

form.addEventListener('submit', () => {
    if (!input.value.trim() || !username) return;
    socket.emit('send_msg', {username, msg: input.value});
    input.value = "";
});

function addMessage(user, msg) {
    const div = document.createElement('div');
    div.className = user === 'BOT' ? 'message bot' : 'message user';
    div.innerHTML = `<strong>${user}:</strong> ${msg.replace(/\n/g, '<br>')}`;
    chatbox.appendChild(div);
    chatbox.scrollTop = chatbox.scrollHeight;
}

socket.on('message', data => {
    addMessage(data.user, data.msg);
});

window.onbeforeunload = function() {
    if (username) socket.emit('leave', {username});
};
</script>
</body>
</html>
